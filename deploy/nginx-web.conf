# Include inside the existing www.tapnap.net server block. Replace its old
# static location / block; keep its TLS, ACME challenge and API proxy locations.
root /var/www/tapnap/current;
index index.html;

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}

# Shared assets survive a release switch, including lazy-loaded JS and WASM.
location ^~ /assets/ {
    alias /var/www/tapnap/shared/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /.tap-release.json {
    return 404;
}
