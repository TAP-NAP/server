services:
  app:
    image: ${APP_IMAGE:-tap-app-attest-server:latest}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SERVER_ADDR: 0.0.0.0:8080
      REDIS_URL: redis://redis:6379
      TEAM_ID: ${TEAM_ID:?set TEAM_ID}
      BUNDLE_ID: ${BUNDLE_ID:?set BUNDLE_ID}
      APP_ATTEST_ENV: ${APP_ATTEST_ENV:-production}
      APPLE_APP_ATTEST_ROOT_CA_PATH: /app/certs/apple_app_attestation_root_ca.pem
      CHALLENGE_TTL_SECONDS: ${CHALLENGE_TTL_SECONDS:-3600}
      RUST_LOG: ${RUST_LOG:-tap_app_attest_server=info,tower_http=info}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${REDIS_DATA_DIR:-./data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-./data/caddy}:/data
      - ${CADDY_CONFIG_DIR:-./data/caddy-config}:/config
